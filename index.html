<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Varsın Sevgilim ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #d81b60;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #4a154b;
            line-height: 1.5;
        }
        .btn {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.4);
        }
        .btn:hover {
            background-color: #ad1457;
            transform: scale(1.05);
        }
        /* Kalp Yağmuru Efekti */
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 1;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(20px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>İyi ki Doğdun Elif'im! ❤️</h1>
        <p>Hayatımı güzelleştiren, her anıma anlam katan birtanecik sevgilim. İyi ki varsın, seni çok seviyorum!</p>
        <button class="btn" onclick="mesajGoster()">Sürprizi Aç 🎁</button>
    </div>

    <script>
        function mesajGoster() {
            alert("Seninle geçirdiğim her gün benim için bir hediye. Seni çok ama çok seviyorum sevgilim! 💕");
        }

        // Otomatik kalp oluşturma efekti
        function kalplerYarat() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(kalplerYarat, 300);
    </script>

</body>
</html>
