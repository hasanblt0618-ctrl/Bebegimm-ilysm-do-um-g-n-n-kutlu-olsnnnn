<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sen Benim Evrenimsin</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050508;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .active {
      display: flex;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      font-weight: 300;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 600px;
    }

    button {
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 25px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }

    /* Yıldızlar Ekranı */
    .stars-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .star {
      position: absolute;
      font-size: 1.8rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }

    .star:hover {
      transform: scale(1.4);
    }

    /* Modal / Pop-up Mesaj Kutusu */
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
      z-index: 10;
      max-width: 80%;
    }

    .modal p {
      margin: 0 0 20px 0;
    }
  </style>
</head>
<body>

  <!-- 1. Giriş Ekranı -->
  <div id="screen1" class="screen active">
    <h1>Hoş geldin, güzelim. ✨</h1>
    <button onclick="startExperience()">Evrenine gir →</button>
  </div>

  <!-- 2. Yıldızlar Ekranı -->
  <div id="screen2" class="screen">
    <p style="position: absolute; top: 20px; font-size: 0.9rem; opacity: 0.8;">
      Gökyüzündeki yıldızlara dokun... ⭐ (<span id="count">0</span>/3)
    </p>
    <div class="stars-container">
      <div class="star" style="top: 25%; left: 20%;" onclick="openMessage(1)">⭐</div>
      <div class="star" style="top: 60%; left: 75%;" onclick="openMessage(2)">✨</div>
      <div class="star" style="top: 40%; left: 50%;" onclick="openMessage(3)">🌟</div>
    </div>
  </div>

  <!-- Mesaj Penceresi -->
  <div id="messageModal" class="modal">
    <p id="modalText"></p>
    <button onclick="closeMessage()">Kapat</button>
  </div>

  <!-- 3. Final Ekranı -->
  <div id="screen3" class="screen">
    <p>🎸 Sana hazırladığım küçük bir sürpriz var.</p>
    <h1 style="margin-top: 20px;">
      Milyarlarca insanın olduğu bu evrende, iyi ki benim karşıma sen çıktın.<br><br>
      İyi ki doğdun. ❤️
    </h1>
    <!-- Şarkı/Ses dosyası buraya bağlanacak -->
    <audio id="bgMusic" src="sarki.mp3"></audio>
  </div>

  <script>
    const messages = {
      1: "Gülüşün gökyüzündeki tüm yıldızlardan daha parlak.",
      2: "Birlikte geçirdiğimiz her an benim en sevdiğim anı oluyor.",
      3: "Seninle hayat çok daha anlamlı ve güzel."
    };

    let readCount = 0;
    const opened = {};

    function startExperience() {
      document.getElementById('screen1').classList.remove('active');
      document.getElementById('screen2').classList.add('active');
    }

    function openMessage(id) {
      document.getElementById('modalText').innerText = messages[id];
      document.getElementById('messageModal').style.display = 'block';

      if (!opened[id]) {
        opened[id] = true;
        readCount++;
        document.getElementById('count').innerText = readCount;
      }
    }

    function closeMessage() {
      document.getElementById('messageModal').style.display = 'none';
      if (readCount >= 3) {
        setTimeout(() => {
          document.getElementById('screen2').classList.remove('active');
          document.getElementById('screen3').classList.add('active');
          
          // Müziği başlat
          const music = document.getElementById('bgMusic');
          if (music.src) {
            music.play().catch(e => console.log("Müzik otomatik başlatılamadı."));
          }
        }, 500);
      }
    }
  </script>
</body>
</html>
